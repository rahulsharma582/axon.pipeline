name: 'Terraform CI/CD Pipeline'

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

  env:
  # Azure Service Principal credentials - GitHub repo Settings > Secrets and variables > Actions me add karo
  ARM_CLIENT_ID: "b7cc0a1e-57da-473a-8c04-6a4d21ce1c85"
  ARM_CLIENT_SECRET: "Lwt8Q~Z8lXVlyUP~lHqXgqFT.6hI5KNs~cAj6aCI"
  ARM_SUBSCRIPTION_ID: "c4b77061-0024-4ace-a30b-97358212e3ef"
  ARM_TENANT_ID: "9760c339-90c7-40e3-bf80-2c3bee82448d"
  TF_IN_AUTOMATION: true

jobs:
  terraform:
    name: 'Terraform Validation & Plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./environment

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan 
        continue-on-error: false
